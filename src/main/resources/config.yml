# HardcoreToggle configuration
# Every line under "messages" (and tab-prefix) uses MiniMessage:
# https://docs.papermc.io/adventure/minimessage/format/
# Preview your text live: https://webui.advntr.dev/
#
# Shortcuts you can use in any message:
#   <prefix>            -> the prefix below
#   <theme>text</theme> -> the main gradient (set under "theme")
#
# This matches the theme used by the rest of the SMP's plugins.
theme:
  open: "<b><gradient:#EFA315:#E08A05>"
  close: "</gradient></b>"

prefix: "<theme>Hardcore</theme> <dark_gray>»</dark_gray> "

# Text shown before a Hardcore player's name in the tab list (MiniMessage)
tab-prefix: "<red>☠ </red>"

# Text returned by the %hardcoretoggle_icon% PlaceholderAPI placeholder for
# Hardcore players (blank/non-Hardcore players get an empty string). This one
# is read by OTHER plugins (e.g. a nametag/tab plugin like TAB), so it stays
# in legacy & codes rather than MiniMessage, since that's what most of those
# plugins expect from a placeholder value.
nametag-placeholder-icon: "&c☠ "

# Reviving: right-clicking a downed player's head starts a timed revive
# (loading bar + note block melody). Set duration to 0 for an instant revive.
revive-duration-seconds: 3
# The revive is cancelled if the reviver moves farther than this many blocks from the head
revive-cancel-distance: 6
# Play the note block melody while reviving
revive-sounds: true

# Whether to broadcast to the whole server when someone enables Hardcore mode
broadcast-on-enable: true

messages:
  enabled-broadcast: "<prefix><player> has enabled <theme>Hardcore mode</theme>!"
  enabled-self: "<prefix><red><theme>Hardcore mode</theme> enabled. Good luck out there."
  disabled-self: "<prefix><green>Hardcore mode disabled."
  already-enabled: "<prefix><red>You already have Hardcore mode enabled."
  already-disabled: "<prefix><red>You don't have Hardcore mode enabled."
  cannot-toggle-while-downed: "<prefix><red>You can't change Hardcore mode while waiting to be revived."
  death-title: "<dark_red><b>You've Died</b></dark_red>"
  death-subtitle: "<gray>Someone needs to right-click your head to revive you"
  death-broadcast: "<prefix><dark_red><player> has died!</dark_red> <gray>Find their head and right-click it to bring them back."
  revived-title: "<green><b>You've Been Revived!</b></green>"
  revived-subtitle: "<gray><reviver> brought you back"
  revive-broadcast: "<prefix><reviver> revived <player>!"
  cannot-self-revive: "<prefix><red>You can't revive yourself — someone else has to do it."
  no-permission: "<prefix><red>You don't have permission to do that."
  usage: "<prefix><red>Usage: /hardcore toggle (or /hardcore reload if you're an admin)"
  reloaded: "<prefix><green>HardcoreToggle config reloaded."
  player-not-found: "<prefix><red>That player isn't online."
  force-revived: "<prefix><green>Revived <player>."
  not-downed: "<prefix><red><player> isn't currently downed."
  reviving-bar: "<green><spinner></green> <white>Reviving <yellow><player></yellow><white>... <gray><percent>%"
  being-revived: "<yellow><reviver></yellow> <gray>is reviving you... <spinner>"
  revive-cancelled: "<prefix><red>Revive cancelled. Stay close to the head until it finishes."
  already-being-revived: "<prefix><red>Someone is already reviving that player."
  target-offline: "<prefix><red>That player is offline right now. They can be revived once they rejoin."
